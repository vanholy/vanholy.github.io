<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Casa Carobbio</title><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body>
<title>Casa Carobbio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: registro tecnico dell'immobile. Testata fissa con schede, colonna unica larga, colori = rami di proprietà (Belotti blu, Pasinetti ambra, Comune tratteggio). */
:root{
  --paper:#f4f5f2; --panel:#ffffff; --soft:#eceeea; --ink:#1c2327; --muted:#59646a; --rule:#d2d8d9;
  --b:#1b6aa0; --b-ink:#17557f; --b-fill:#dbe8f2;
  --p:#a8681a; --p-ink:#7a4a0f; --p-fill:#f3e2c6;
  --c:#7d8676; --c-ink:#3f463b; --c-fill:#e8eae4; --c-hatch:#a9b0a0;
  --warn:#a5402a; --warn-bg:#f8e6e0; --mid:#8a5f00; --mid-bg:#f6ecd2; --ok:#2c7448; --ok-bg:#e1f0e6;
  --bar:#4b5a62; --btn:#1c2327; --btn-ink:#f4f5f2; --focus:#1b6aa0;
  --shadow:0 1px 2px rgba(20,28,32,.06),0 8px 24px rgba(20,28,32,.08);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a1d; --panel:#1c2327; --soft:#232b30; --ink:#e7ecee; --muted:#9ba7ad; --rule:#333d42;
  --b:#3a8fc8; --b-ink:#9cc9ea; --b-fill:#1b3547;
  --p:#c0822e; --p-ink:#efc489; --p-fill:#42301a;
  --c:#9aa392; --c-ink:#cfd5c8; --c-fill:#262b25; --c-hatch:#4e5649;
  --warn:#ef907a; --warn-bg:#3a221c; --mid:#e3bd62; --mid-bg:#3a2f15; --ok:#7fcf9a; --ok-bg:#1a3324;
  --bar:#9fb0b8; --btn:#e7ecee; --btn-ink:#141a1d; --focus:#7fb8de;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a1d; --panel:#1c2327; --soft:#232b30; --ink:#e7ecee; --muted:#9ba7ad; --rule:#333d42;
  --b:#3a8fc8; --b-ink:#9cc9ea; --b-fill:#1b3547;
  --p:#c0822e; --p-ink:#efc489; --p-fill:#42301a;
  --c:#9aa392; --c-ink:#cfd5c8; --c-fill:#262b25; --c-hatch:#4e5649;
  --warn:#ef907a; --warn-bg:#3a221c; --mid:#e3bd62; --mid-bg:#3a2f15; --ok:#7fcf9a; --ok-bg:#1a3324;
  --bar:#9fb0b8; --btn:#e7ecee; --btn-ink:#141a1d; --focus:#7fb8de;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(30px,5vw,42px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(20px,3vw,25px);font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0;max-width:70ch}
a{color:var(--b-ink)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:2px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
@media (max-width:520px){.brand span:not(.save){display:none}}
.brand .save{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.warn{background:var(--mid)} .dot.bad{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-radius:0;border-bottom:3px solid transparent;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:15px;padding:10px 10px 11px;white-space:nowrap;line-height:1.2}
nav.tabs button:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--rule)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs button .count{font-family:var(--f-mono);font-size:11px;font-weight:600;margin-left:4px;padding:0 5px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}

.gsearch{margin-left:auto;width:260px;max-width:100%;padding:6px 10px;font-size:14px}
.brand .gsearch + .save{margin-left:0}
@media (max-width:700px){.gsearch{order:5;flex:1 1 100%;width:auto;margin:6px 0 0}.brand .gsearch + .save{margin-left:auto}}
.scad{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--rule);align-items:start;border-left:4px solid var(--sev,transparent)}
.scad:last-child{border-bottom:0}
.scad.late{--sev:var(--warn)} .scad.soon{--sev:var(--mid)} .scad.done{opacity:.75}
.scad .when{font-family:var(--f-mono);font-size:13px;font-weight:600}
.scad .when small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.scad .side{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
@media (max-width:620px){.scad{grid-template-columns:minmax(0,1fr)}.scad .side{justify-content:flex-start}}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog > i{display:block;height:100%;background:var(--ok)}
tr.now td{background:var(--mid-bg)}
.note-box{border-left:4px solid var(--mid);background:var(--mid-bg);padding:10px 14px;border-radius:4px;font-size:14px}
mark{background:var(--mid-bg);color:inherit;padding:0 1px;border-radius:2px}
.nav-pick{display:none}
@media (max-width:700px){
  nav.tabs{display:none}
  .nav-pick{display:flex;align-items:center;gap:10px;padding-block:6px 10px}
  .nav-pick span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .nav-pick select{flex:1;font-family:var(--f-display);font-weight:600;font-size:16px;padding:8px 10px}
}
main:focus{outline:none}
.linkish{background:none;border:0;padding:0;border-radius:0;color:var(--b-ink);text-decoration:underline;font:inherit;font-weight:inherit;cursor:pointer;display:inline;text-align:left}
.linkish.mono{font-family:var(--f-mono);font-weight:600}
button.kpi{font-weight:400;text-align:left;line-height:1.4;align-items:start;justify-items:start;width:100%;cursor:pointer}
button.kpi:hover{border-color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 80px;display:grid;gap:34px}
section{display:grid;gap:14px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.head > div{display:grid;gap:4px;min-width:0}
.lead{font-size:16px;color:var(--muted)}

/* pulsanti e controlli */
button,.btn{font:inherit;font-family:var(--f-body);font-weight:600;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:8px 13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
button:hover,.btn:hover{border-color:var(--muted)}
button.primary,.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
button.primary:hover{opacity:.9}
button.danger{color:var(--warn);border-color:var(--warn)}
button.danger.armed{background:var(--warn);color:var(--panel)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--rule)}
button.mini{padding:4px 8px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f small{font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{width:auto;min-width:0;max-width:100%;padding:6px 9px;font-size:14px}
.filters input[type=search]{flex:1 1 200px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:13.5px;background:var(--panel);color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* pill e chip */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border:1.5px solid;border-radius:3px;white-space:nowrap;line-height:1.5}
.pill.belotti{color:var(--b-ink);border-color:var(--b);background:var(--b-fill)}
.pill.pasinetti{color:var(--p-ink);border-color:var(--p);background:var(--p-fill)}
.pill.comune{color:var(--c-ink);border-color:var(--c);background:var(--c-fill)}
.pill.st-aperta,.pill.st-alta,.pill.st-da-procurare{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.st-in-corso,.pill.st-media,.pill.st-richiesto,.pill.st-in-valutazione,.pill.st-ricevuto{color:var(--mid);border-color:var(--mid);background:var(--mid-bg)}
.pill.st-risolta,.pill.st-ottenuto,.pill.st-accettato{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.st-bassa,.pill.st-scartato,.pill.st-stima,.pill.neutral{color:var(--muted);border-color:var(--rule);background:var(--soft)}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:0 6px;border:1px solid var(--rule);border-radius:3px;background:var(--soft);white-space:nowrap}

/* card e pannelli */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* testata panoramica */
.hero{display:grid;gap:12px;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

.owner{background:var(--panel);border:1px solid var(--rule);border-top:5px solid var(--o);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.owner.belotti{--o:var(--b)} .owner.pasinetti{--o:var(--p)} .owner.comune{--o:var(--c)}
.owner h3 small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
.owner ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px}
.owner li{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:baseline}
.owner li .mono{font-weight:600}
.owner .foot{font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:8px}
.owner .next{font-size:13px;border-top:1px dashed var(--rule);padding-top:8px}
.owner .next b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:2px;text-decoration:none;color:inherit;min-width:0}
a.kpi:hover{border-color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .s{font-size:12.5px;color:var(--muted)}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--mid);background:var(--mid-bg);color:var(--ink)}
.banner.bad{border-color:var(--warn);background:var(--warn-bg)}
.banner p{font-size:14px}

/* liste */
.list{display:grid;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 14px;border-bottom:1px solid var(--rule);align-items:start}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .d{font-size:13.5px;color:var(--muted)}
.row .side{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .side{justify-content:flex-start}}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}

/* tabelle */
.table{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
th{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12.5px}
td.sub{font-family:var(--f-mono);font-weight:600;font-size:15px;white-space:nowrap}
tr.belotti td.sub{color:var(--b-ink);box-shadow:inset 4px 0 0 var(--b)}
tr.pasinetti td.sub{color:var(--p-ink);box-shadow:inset 4px 0 0 var(--p)}
tr.comune td.sub{color:var(--c-ink);box-shadow:inset 4px 0 0 var(--c)}
tr.gone td{color:var(--muted)}
tfoot td{font-weight:600;border-top:1px solid var(--rule)}

/* subalterni */
.subwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.subwrap{grid-template-columns:1fr}}
.fig{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll svg{display:block;width:100%;min-width:560px;height:auto}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.plans{grid-template-columns:1fr}}
.plan{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 8px 10px;display:grid;gap:4px;min-width:0}
.plan svg{width:100%;height:auto;display:block}
.plan figcaption{font-family:var(--f-display);font-weight:600;font-size:14.5px;text-align:center}
svg .b-fill{fill:var(--b-fill);stroke:var(--b);stroke-width:1.6}
svg .p-fill{fill:var(--p-fill);stroke:var(--p);stroke-width:1.6}
svg .c-fill{fill:url(#hatch);stroke:var(--c);stroke-width:1.2}
svg .c-fill.strong{stroke-width:1.6}
svg .ghost{fill:none;stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4}
svg .ghost-b{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg .bot{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
svg .ground{fill:var(--muted)}
svg .dim{stroke:var(--muted);stroke-width:1}
svg text{font-family:var(--f-body);fill:var(--ink);pointer-events:none}
svg .n{font-family:var(--f-mono);font-weight:600;font-size:17px}
svg .n.sm{font-size:13px}
svg .lbl{font-size:11.5px}
svg .lbl.sm{font-size:10.5px}
svg .lbl.xs{font-size:9px;fill:var(--muted)}
svg .note{font-size:10.5px;fill:var(--muted);font-style:italic}
svg .lvl{font-family:var(--f-mono);font-weight:600;font-size:14px;fill:var(--muted)}
svg .north path{fill:var(--ink)} svg .north text{font-family:var(--f-mono);font-size:11px;font-weight:600}
svg [data-sub]{cursor:pointer;transition:filter .12s}
svg [data-sub]:hover{filter:brightness(.93)}
svg [data-sub].sel{stroke:var(--ink);stroke-width:3}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);display:grid;gap:12px}
@media (max-width:900px){.detail{position:static}}
.detail .big{font-family:var(--f-mono);font-size:34px;font-weight:600;line-height:1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;align-items:center}
.sw{display:inline-block;width:16px;height:12px;border:1.5px solid;vertical-align:-1px;margin-right:6px}
.sw.belotti{background:var(--b-fill);border-color:var(--b)} .sw.pasinetti{background:var(--p-fill);border-color:var(--p)}
.sw.comune{background:repeating-linear-gradient(45deg,var(--c-fill) 0 3px,var(--c-hatch) 3px 4px);border-color:var(--c)}

/* storia */
.tl{display:grid;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tl-item{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:4px 16px;padding:13px 16px;border-bottom:1px solid var(--rule);border-left:4px solid var(--o,var(--rule))}
.tl-item:last-child{border-bottom:0}
.tl-item.belotti{--o:var(--b)} .tl-item.pasinetti{--o:var(--p)} .tl-item.comune{--o:var(--c)}
.tl-item .y{font-family:var(--f-mono);font-weight:600;font-size:14px}
.tl-item .y small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.tl-item .body{display:grid;gap:4px;min-width:0}
.tl-item .ref{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.tl-item .tags{display:flex;flex-wrap:wrap;gap:5px}
.tl-item.prev{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--soft) 10px 11px)}
@media (max-width:620px){.tl-item{grid-template-columns:minmax(0,1fr) auto}.tl-item .y{grid-column:1/-1}}

/* ===================================================================
   Casa Carobbio · webapp
   Fase 1: dati nel browser (localStorage). Il resto dell'app parla solo
   con Repo, che usa un "adattatore". Per passare al NAS basta scrivere un
   ApiAdapter con gli stessi metodi (loadAll, put, del, saveMeta) e
   impostarlo in Repo.adapter. Il backup JSON si importa nel nuovo DB.
   =================================================================== */
const APP_ID = 'casa-carobbio';
const SCHEMA = 1;
const STORE_KEY = 'casa-carobbio.v1';
const COLLS = ['subalterni','quote','soggetti','eventi','documenti','criticita','checklist','spese','preventivi','detrazioni','scadenze'];

/* ---------- adattatore: memoria del browser ---------- */
const LocalAdapter = {
  name: 'Memoria del browser (solo questo dispositivo)',
  ok: null,
  test(){ try{ const k='__cc_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); this.ok=true; }catch(e){ this.ok=false; } return this.ok; },
  async loadAll(){ try{ const s=localStorage.getItem(STORE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  async saveAll(db){ if(!this.ok) return false; try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }catch(e){ return false; } },
  async put(coll, rec, db){ return this.saveAll(db); },
  async del(coll, id, db){ return this.saveAll(db); },
  async saveMeta(db){ return this.saveAll(db); },
  async clear(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
};
/* ---------- adattatore: Supabase (pagina pubblicata) ----------
   Attivo quando la build definisce CC_SUPABASE = {url, key} (chiave pubblica anon).
   Tabelle cc_records (una riga per record) e cc_meta (meta, settings, immobile). */
const META_KEYS = ['meta','settings','immobile'];
const SupabaseAdapter = {
  name: 'Supabase (condiviso con i familiari)',
  ok: null, sb: null, user: null, nome: '', ruolo: null, err: '',
  test(){ this.ok = !!this.user; return this.ok; },
  async connect(){
    this.sb = supabase.createClient(CC_SUPABASE.url, CC_SUPABASE.key);
    const { data, error } = await this.sb.auth.getSession(); if(error) throw error;
    this.user = data.session ? data.session.user : null;
    if(!this.user) return;
    const r = await this.sb.from('cc_membri').select('nome,ruolo').eq('user_id', this.user.id).maybeSingle();
    if(r.error) throw r.error;
    this.nome = r.data ? r.data.nome : ''; this.ruolo = r.data ? r.data.ruolo : null;
  },
  fail(e){ this.err = (e && e.message) || String(e); console.warn('Supabase:', this.err); return false; },
  async liveRows(cols){ // PostgREST restituisce al massimo 1000 righe per richiesta
    const out = [];
    for(let from=0;; from+=1000){
      const { data, error } = await this.sb.from('cc_records').select(cols).eq('deleted', false).order('coll').order('id').range(from, from+999);
      if(error) throw error; out.push(...data); if(data.length<1000) return out;
    }
  },
  async loadAll(){
    const rows = await this.liveRows('coll,data');
    const { data: meta, error } = await this.sb.from('cc_meta').select('key,value'); if(error) throw error;
    if(!rows.length && !meta.length) return null;
    const base = freshDb(), db = { app: APP_ID, schema: SCHEMA, colls: {} };
    META_KEYS.forEach(k => { const m = meta.find(x => x.key===k); db[k] = m ? m.value : base[k]; });
    db.settings = {...db.settings, utente: this.nome}; // chi modifica = il membro collegato
    COLLS.forEach(c => db.colls[c] = []);
    rows.forEach(r => (db.colls[r.coll] = db.colls[r.coll] || []).push(r.data));
    return db;
  },
  async saveMeta(db){
    try{
      const { utente, ...settings } = db.settings || {};
      const { error } = await this.sb.from('cc_meta').upsert([{key:'meta', value:db.meta}, {key:'settings', value:settings}, {key:'immobile', value:db.immobile||{}}]);
      if(error) throw error; this.err = ''; return true;
    }catch(e){ return this.fail(e); }
  },
  async put(coll, rec, db){
    try{
      const { error } = await this.sb.from('cc_records').upsert({coll, id:rec.id, data:rec, deleted:false}); if(error) throw error;
      return this.saveMeta(db);
    }catch(e){ return this.fail(e); }
  },
  async del(coll, id, db){
    try{
      const { error } = await this.sb.from('cc_records').update({deleted:true}).eq('coll', coll).eq('id', id); if(error) throw error;
      return this.saveMeta(db);
    }catch(e){ return this.fail(e); }
  },
  /* Import di un backup: scrive tutti i record e segna come eliminati quelli che non ci sono più. */
  async saveAll(db){
    try{
      const rows = [], keep = new Set();
      COLLS.forEach(c => (db.colls[c]||[]).forEach(r => { rows.push({coll:c, id:r.id, data:r, deleted:false}); keep.add(c+'\n'+r.id); }));
      for(let i=0; i<rows.length; i+=500){ const { error } = await this.sb.from('cc_records').upsert(rows.slice(i, i+500)); if(error) throw error; }
      const gone = {};
      (await this.liveRows('coll,id')).forEach(r => { if(!keep.has(r.coll+'\n'+r.id)) (gone[r.coll] = gone[r.coll] || []).push(r.id); });
      for(const [c, ids] of Object.entries(gone)){
        for(let i=0; i<ids.length; i+=200){ const { error } = await this.sb.from('cc_records').update({deleted:true}).eq('coll', c).in('id', ids.slice(i, i+200)); if(error) throw error; }
      }
      return this.saveMeta(db);
    }catch(e){ return this.fail(e); }
  }
};

let saveOk = true;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function nowIso(){ return new Date().toISOString(); }
function todayIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function newId(prefix){ return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function freshDb(){
  const colls = {};
  COLLS.forEach(c => colls[c] = clone(SEED[c]).map(r => ({...r, _seed:true})));
  return {
    app: APP_ID, schema: SCHEMA,
    meta: { seedVersion: SEED_VERSION, created: nowIso(), updated: nowIso(), lastBackup: null, changesSinceBackup: 0, deletedSeed: [] },
    settings: { docBase: '', quotaBelotti: 50, utente: '' },
    immobile: clone(SEED.immobile),
    colls
  };
}
/* Aggiorna i dati di riferimento quando la pagina viene ripubblicata con un seed più nuovo:
   aggiunge i record nuovi e sostituisce quelli di riferimento mai modificati. */
function upgradeSeed(db){
  if((db.meta.seedVersion||0) >= SEED_VERSION) return db;
  const deleted = new Set(db.meta.deletedSeed||[]);
  COLLS.forEach(c => {
    const list = db.colls[c] = db.colls[c] || [];
    SEED[c].forEach(sr => {
      if(deleted.has(sr.id)) return;
      const i = list.findIndex(r => r.id===sr.id);
      if(i<0) list.push({...clone(sr), _seed:true});
      else if(!list[i]._mod) list[i] = {...clone(sr), _seed:true};
    });
  });
  db.immobile = clone(SEED.immobile);
  db.meta.seedVersion = SEED_VERSION;
  return db;
}

const Repo = {
  adapter: LocalAdapter,
  async init(){
    this.adapter.test();
    let d = await this.adapter.loadAll();
    if(!d || d.app!==APP_ID){ d = freshDb(); DB = d; saveOk = await this.adapter.saveAll(d); }
    else {
      COLLS.forEach(c => { d.colls[c] = d.colls[c] || []; }); d.settings = {docBase:'', quotaBelotti:50, utente:'', ...(d.settings||{})};
      const v = d.meta.seedVersion||0; DB = upgradeSeed(d);
      // riscrive tutto solo se il seed è cambiato: con Supabase non sovrascrive le modifiche degli altri
      saveOk = DB.meta.seedVersion!==v || !isShared() ? await this.adapter.saveAll(DB) : true;
    }
  },
  list(c){ return DB.colls[c] || []; },
  get(c, id){ return this.list(c).find(r => r.id===id); },
  touch(){ DB.meta.updated = nowIso(); DB.meta.changesSinceBackup = (DB.meta.changesSinceBackup||0)+1; },
  async put(c, rec){
    const list = this.list(c);
    rec._upd = nowIso(); if(DB.settings.utente) rec._by = DB.settings.utente;
    const i = list.findIndex(r => r.id===rec.id);
    if(i>=0){ if(list[i]._seed) rec._mod = true; list[i] = rec; } else list.push(rec);
    this.touch(); saveOk = await this.adapter.put(c, rec, DB); renderStatus(); return rec;
  },
  async del(c, id){
    const list = this.list(c); const i = list.findIndex(r => r.id===id); if(i<0) return;
    if(list[i]._seed){ DB.meta.deletedSeed = DB.meta.deletedSeed||[]; DB.meta.deletedSeed.push(id); }
    list.splice(i,1); this.touch(); saveOk = await this.adapter.del(c, id, DB); renderStatus();
  },
  async saveMeta(){ saveOk = await this.adapter.saveMeta(DB); renderStatus(); },
  async replaceAll(d){ DB = d; saveOk = await this.adapter.saveAll(DB); renderStatus(); }
};

/* ---------- utilità ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = c => (c===null || c===undefined || c==='' || isNaN(c)) ? '—' : (c/100).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const eur0 = c => (c===null || c===undefined || isNaN(c)) ? '—' : (c/100).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function fmtDate(s, testo){
  if(testo) return testo;
  if(!s) return '';
  if(s==='?') return 'data da recuperare';
  const m = String(s).match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/);
  if(!m) return s;
  if(m[3]) return m[3]+'/'+m[2]+'/'+m[1];
  if(m[2]) return MESI[+m[2]-1]+' '+m[1];
  return m[1];
}
function parseMoney(v){
  if(v===null || v===undefined) return null;
  let s = String(v).trim().replace(/[€\s]/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s);
  return isFinite(n) ? Math.round(n*100) : NaN;
}
const moneyInput = c => (c===null || c===undefined || c==='') ? '' : (c/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const RAMI = { belotti:'Belotti', pasinetti:'Pasinetti', comune:'Comune' };
const ramoPill = r => r && RAMI[r] ? `<span class="pill ${r}">${RAMI[r]}</span>` : '';
const slug = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const stPill = s => s ? `<span class="pill st-${slug(s)}">${esc(s)}</span>` : '';
function subsList(str){ return String(str||'').split(/[^0-9]+/).filter(Boolean); }
function hasSub(str, sub){ return subsList(str).includes(String(sub)); }
function sortKey(d){ return d ? String(d) : '9999'; }

function quote(spesa){
  if(spesa.ramo==='belotti') return {b:100, p:0};
  if(spesa.ramo==='pasinetti') return {b:0, p:100};
  const b = (spesa.quotaBelotti===null || spesa.quotaBelotti===undefined || spesa.quotaBelotti==='') ? (DB.settings.quotaBelotti??50) : +spesa.quotaBelotti;
  return {b, p:100-b};
}
function docHref(d){
  if(!d) return '';
  const base = (DB.settings.docBase||'').trim();
  if(base && d.percorso) return base.replace(/\/+$/,'') + '/' + d.percorso.split('/').map(encodeURIComponent).join('/');
  return d.url || '';
}

let toastTimer;
function toast(msg){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); toast('Copiato: '+text); }
  catch(e){
    const v = btn && btn.closest('.contact') ? btn.closest('.contact').querySelector('.v') : null;
    if(v){ const r=document.createRange(); r.selectNodeContents(v); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Testo selezionato: copialo con Ctrl+C'); }
    else toast('Copia non disponibile qui');
  }
}

/* ---------- dialog generico ---------- */
const dlg = () => $('#dlg');
let dlgCtx = null;
function fieldHtml(f, v){
  const id = 'f-'+f.k;
  const req = f.req ? ' required' : '';
  let input;
  if(f.type==='select'){
    input = `<select id="${id}" name="${f.k}">${f.opts.map(o => { const [val,lab] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}"${String(v??'')===String(val)?' selected':''}>${esc(lab)}</option>`; }).join('')}</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  } else if(f.type==='check'){
    return `<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="${id}" name="${f.k}"${v?' checked':''}> ${esc(f.label)}</label>`;
  } else if(f.type==='doc'){
    const docs = Repo.list('documenti').slice().sort((a,b)=>sortKey(b.data).localeCompare(sortKey(a.data)));
    input = `<select id="${id}" name="${f.k}"><option value="">Nessuno</option>${docs.map(d => `<option value="${esc(d.id)}"${v===d.id?' selected':''}>${esc(fmtDate(d.data))} · ${esc(d.titolo)}</option>`).join('')}</select>`;
  } else if(f.type==='spesa'){
    const sp = Repo.list('spese').slice().sort((a,b)=>sortKey(b.data).localeCompare(sortKey(a.data)));
    input = `<select id="${id}" name="${f.k}"><option value="">Nessuna</option>${sp.map(s => `<option value="${esc(s.id)}"${v===s.id?' selected':''}>${esc(fmtDate(s.data))} · ${esc(s.descrizione)} · ${esc(eur(s.totale))}</option>`).join('')}</select>`;
  } else if(f.type==='money'){
    input = `<input id="${id}" name="${f.k}" inputmode="decimal" placeholder="0,00" value="${esc(moneyInput(v))}"${req}>`;
  } else {
    const t = f.type==='date' ? 'date' : f.type==='number' ? 'number' : f.type==='tel' ? 'tel' : f.type==='email' ? 'email' : f.type==='url' ? 'url' : 'text';
    const val = (t==='date' && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) ? '' : v;
    input = `<input id="${id}" name="${f.k}" type="${t}" value="${esc(val)}"${f.min!==undefined?` min="${f.min}"`:''}${f.max!==undefined?` max="${f.max}"`:''}${f.list?` list="${f.list}"`:''}${req}>`;
    if(t==='date' && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) input += `<small class="muted">Data attuale: ${esc(fmtDate(v))}. Lasciala vuota per non cambiarla.</small>`;
  }
  return `<label class="f${f.wide?' wide':''}" for="${id}">${esc(f.label)}${f.help?` <small>${esc(f.help)}</small>`:''}${input}</label>`;
}
function datalists(){
  const fornitori = new Set(); const persone = new Set(Repo.list('quote').map(q => q.soggetto).filter(Boolean));
  Repo.list('soggetti').forEach(s => { if(['Professionisti','Fornitori','Uffici'].includes(s.gruppo)) fornitori.add(s.nome); else if(s.gruppo!=='Storici') persone.add(s.nome); });
  Repo.list('spese').forEach(s => { if(s.fornitore) fornitori.add(s.fornitore); if(s.pagatoDa) persone.add(s.pagatoDa); });
  Repo.list('preventivi').forEach(s => { if(s.fornitore) fornitori.add(s.fornitore); });
  const dl = (id, set) => `<datalist id="${id}">${[...set].map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`;
  return dl('dl-fornitori', fornitori) + dl('dl-persone', persone);
}
function openForm(coll, rec, opts={}){
  const sc = SCHEMAS[coll];
  const isNew = !rec;
  const data = rec ? clone(rec) : {...(opts.preset||{})};
  dlgCtx = { coll, id: rec ? rec.id : null, data, onSaved: opts.onSaved };
  const title = opts.title || (isNew ? 'Nuovo '+sc.label : 'Modifica '+sc.label);
  dlg().innerHTML = `<form class="dlg" id="dlg-form" novalidate>
    <header><h3>${esc(title)}</h3><button type="button" class="ghost" data-act="dlg-close" aria-label="Chiudi">Chiudi</button></header>
    <div class="body">${opts.intro?`<p class="muted small">${opts.intro}</p>`:''}<div class="form-grid">${sc.fields.map(f => fieldHtml(f, data[f.k])).join('')}</div>${datalists()}<p class="err" id="dlg-err" hidden></p></div>
    <footer><div class="actions">${!isNew?`<button type="button" class="danger" data-act="dlg-del">Elimina</button>`:''}</div>
    <div class="actions"><button type="button" data-act="dlg-close">Annulla</button><button type="submit" class="primary">${isNew?'Aggiungi':'Salva'}</button></div></footer>
  </form>`;
  dlg().showModal();
  const first = dlg().querySelector('input:not([type=checkbox]),select,textarea'); if(first) first.focus();
}
function readForm(coll, base){
  const sc = SCHEMAS[coll]; const out = {...base}; const errs = [];
  sc.fields.forEach(f => {
    const el = $('#f-'+f.k); if(!el) return;
    let v;
    if(f.type==='check') v = el.checked;
    else if(f.type==='money'){ v = parseMoney(el.value); if(Number.isNaN(v)){ errs.push(f.label+': importo non valido (es. 1.250,00)'); v = null; } }
    else if(f.type==='number'){ v = el.value==='' ? null : Number(el.value); }
    else if(f.type==='date'){ v = el.value || base[f.k] || ''; }
    else v = el.value.trim();
    if(f.req && (v===null || v==='' )) errs.push(f.label+' è obbligatorio');
    out[f.k] = v;
  });
  return {out, errs};
}
async function submitForm(){
  const {coll, id, data, onSaved} = dlgCtx;
  const {out, errs} = readForm(coll, data);
  if(errs.length){ const e=$('#dlg-err'); e.textContent = errs.join('. '); e.hidden=false; return; }
  if(!id) out.id = newId(SCHEMAS[coll].prefix); else out.id = id;
  await Repo.put(coll, out);
  dlg().close();
  toast(id ? 'Modifiche salvate' : 'Aggiunto');
  if(onSaved) await onSaved(out);
  render();
}

/* ---------- stato salvataggio ---------- */
function backupAgeDays(){ if(!DB.meta.lastBackup) return null; return Math.floor((Date.now()-new Date(DB.meta.lastBackup).getTime())/86400000); }
function renderStatus(){
  const el = $('#save-state'); if(!el) return;
  if(isShared()){ el.innerHTML = saveOk ? '<i class="dot"></i>Salvato su Supabase' : '<i class="dot bad"></i>Non salvato su Supabase'; return; }
  if(!LocalAdapter.ok || !saveOk){ el.innerHTML = '<i class="dot bad"></i>Non salvato nel browser'; return; }
  const n = DB.meta.changesSinceBackup||0;
  el.innerHTML = n ? `<i class="dot warn"></i>${n} modific${n===1?'a':'he'} senza backup` : '<i class="dot"></i>Salvato nel browser';
}
function backupBanner(){
  if(isShared()) return saveOk ? '' : `<div class="banner bad"><p><b>L'ultima modifica non è stata salvata su Supabase.</b> ${esc(SupabaseAdapter.err)} Ricarica la pagina prima di continuare.</p><button type="button" class="primary" data-nav="dati">Vedi lo stato</button></div>`;
  if(!LocalAdapter.ok || !saveOk) return `<div class="banner bad"><p><b>La memoria del browser non è disponibile.</b> Le modifiche restano solo finché la pagina è aperta. Esporta un backup prima di chiuderla.</p><button type="button" class="primary" data-nav="dati">Vai al backup</button></div>`;
  const n = DB.meta.changesSinceBackup||0; const age = backupAgeDays();
  if(n===0) return '';
  const when = age===null ? 'Non hai ancora esportato un backup.' : `Ultimo backup ${age===0?'oggi':age===1?'ieri':age+' giorni fa'}.`;
  return `<div class="banner"><p><b>${n} modific${n===1?'a':'he'} solo in questo browser.</b> ${when} I dati inseriti qui non arrivano agli altri dispositivi finché non passiamo al NAS.</p><button type="button" data-nav="dati">Esporta backup</button></div>`;
}

async function submitCambio(){
  const ramo = $('#cb-ramo').value, data = $('#cb-data').value, sogg = $('#cb-sogg').value.trim();
  const dir = $('#cb-dir').value, quotaV = $('#cb-quota').value.trim(), tipo = $('#cb-tipo').value, atto = $('#cb-atto').value.trim();
  if(!sogg || !data){ const e=$('#cb-err'); e.textContent='Indica il nuovo intestatario e la data.'; e.hidden=false; return; }
  const subs = subsDelRamo(ramo);
  const open = Repo.list('quote').filter(q => q.ramo===ramo && !q.al);
  for(const q of open){
    const isUso = q.diritto==='Comodato d\'uso' || q.diritto==='Locazione';
    if((isUso && $('#cb-comodato').checked) || (!isUso && $('#cb-close').checked)) await Repo.put('quote', {...q, al:data});
  }
  await Repo.put('quote', { id:newId('q'), ramo, subs, soggetto:sogg, diritto:dir, quota:quotaV, dal:data, al:'', atto:(tipo+(atto?': '+atto:'')), note:'' });
  await Repo.put('eventi', { id:newId('e'), data, dataTesto:'', ramo, tipo:'Atto', stato:'avvenuto', titolo:`${tipo}: ${sogg} diventa intestatario (${dir.toLowerCase()} ${quotaV})`, descrizione:'', riferimento:atto, subs });
  dlg().close(); toast('Cambio di proprietà registrato'); render();
}

function speseFiltrate(){
  return Repo.list('spese').filter(s =>
    (!UI.speseAnno || String(s.data||'').startsWith(UI.speseAnno)) && (!UI.speseCat || s.categoria===UI.speseCat) &&
    (!UI.speseRamo || s.ramo===UI.speseRamo) && (!UI.spesePag || (s.pagatoDa||'')===UI.spesePag)
  ).sort((a,b)=>sortKey(b.data).localeCompare(sortKey(a.data)));
}
function viewSpese(){
  const all = Repo.list('spese');
  const anni = [...new Set(all.map(s=>String(s.data||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const pag = [...new Set(all.map(s=>s.pagatoDa).filter(Boolean))].sort();
  const list = speseFiltrate();
  const tot = list.reduce((a,s)=>a+(s.totale||0),0);
  let qb = 0, qp = 0; list.forEach(s => { const q = quote(s); qb += (s.totale||0)*q.b/100; qp += (s.totale||0)*q.p/100; });
  const byCat = {}; list.forEach(s => { const k = s.categoria||'Altro'; byCat[k] = (byCat[k]||0)+(s.totale||0); });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 0;
  const pctB = tot ? Math.round(qb/tot*100) : 0;
  return `
  <section><div class="head"><div><h2>Spese</h2><p class="muted">Ogni spesa ha chi la paga e su chi ricade: Belotti, Pasinetti o parti comuni divise in percentuale (predefinito ${DB.settings.quotaBelotti??50}% Belotti).</p></div>

      <select id="flt-anno" data-ui="speseAnno" aria-label="Anno"><option value="">Tutti gli anni</option>${anni.map(a=>`<option${UI.speseAnno===a?' selected':''}>${a}</option>`).join('')}</select>
      <select id="flt-cat" data-ui="speseCat" aria-label="Categoria"><option value="">Tutte le categorie</option>${CAT_SPESE.map(c=>`<option${UI.speseCat===c?' selected':''}>${c}</option>`).join('')}</select>
      <select id="flt-ramo" data-ui="speseRamo" aria-label="A carico di"><option value="">Tutti i rami</option>${RAMO_OPTS.map(([v,l])=>`<option value="${v}"${UI.speseRamo===v?' selected':''}>${l}</option>`).join('')}</select>
      <select id="flt-pag" data-ui="spesePag" aria-label="Pagato da"><option value="">Pagato da chiunque</option>${pag.map(p=>`<option${UI.spesePag===p?' selected':''}>${esc(p)}</option>`).join('')}</select>
    </div></section>
  <section class="summary">
    <div class="kpi"><span class="l">Totale</span><span class="v">${eur0(tot)}</span><span class="s">${list.length} spes${list.length===1?'a':'e'}</span></div>
    <div class="kpi"><span class="l">A carico Belotti</span><span class="v">${eur0(qb)}</span><span class="s">${pctB}% del totale</span></div>
    <div class="kpi"><span class="l">A carico Pasinetti</span><span class="v">${eur0(qp)}</span><span class="s">${tot?100-pctB:0}% del totale</span></div>
    <div class="kpi"><span class="l">Da verificare</span><span class="v">${list.filter(s=>s.daVerificare).length}</span><span class="s">spese con dubbi aperti</span></div>
  </section>
  ${list.length?`<div class="grid2">
    <div class="panel" style="display:grid;gap:12px"><h3>Per categoria</h3><div class="bars">${cats.map(([k,v])=>`<div class="bar-row" title="${esc(k)}: ${eur(v)}"><span class="lab">${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${max?Math.max(1,v/max*100):0}%"></div></div><span class="val">${eur(v)}</span></div>`).join('')}</div></div>
    <div class="panel" style="display:grid;gap:12px;align-content:start"><h3>Ripartizione tra i due rami</h3>
      <div class="split" role="img" aria-label="Belotti ${pctB}%, Pasinetti ${100-pctB}%">${qb?`<div class="sb" style="flex:${qb}" title="Belotti ${eur(qb)}"></div>`:''}${qp?`<div class="sp" style="flex:${qp}" title="Pasinetti ${eur(qp)}"></div>`:''}</div>
      <div class="split-leg"><span><i style="background:var(--b)"></i>Belotti ${eur(qb)} · ${pctB}%</span><span><i style="background:var(--p)"></i>Pasinetti ${eur(qp)} · ${100-pctB}%</span></div>
      <p class="small muted">Le spese comuni sono divise secondo la quota indicata in ogni spesa.</p></div>
  </div>`:''}
  <section><div class="table"><table>

function viewPreventivi(){

  const card = p => {
    const linked = spese.filter(s => s.preventivoId===p.id);
    const speso = linked.reduce((a,s)=>a+(s.totale||0),0);
    const doc = p.documentoId ? Repo.get('documenti', p.documentoId) : null; const h = docHref(doc);
    return `<div class="row"><div><div class="t">${esc(p.fornitore)}</div><div class="d">${esc(p.oggetto)}</div><div class="d">${esc(fmtDate(p.data))}${p.note?' · '+esc(p.note):''}${h?` · <a href="${esc(h)}" target="_blank" rel="noopener">Apri il preventivo</a>`:''}</div>
      ${linked.length?`<div class="d">Spese registrate: <b class="num">${eur(speso)}</b> (${linked.length})</div>`:''}</div>
      <div class="side"><span class="mono num"><b>${eur0(p.importo)}${p.importoMax?' – '+eur0(p.importoMax):''}</b></span><span class="muted small">IVA ${esc(p.iva||'')}</span>${stPill(p.stato)}${ramoPill(p.ramo)}
      ${p.stato!=='stima' && p.stato!=='scartato'?`<button class="mini" data-act="prev-spesa" data-id="${esc(p.id)}">Registra spesa</button>`:''}<button class="mini ghost" data-act="edit" data-coll="preventivi" data-id="${esc(p.id)}">Modifica</button></div></div>`;
  };
  return `

  ${all.length?'':'<div class="empty">Ancora nessun preventivo.</div>'}`;
}

let downloadsNs;
async function getDownloads(){
  if(downloadsNs !== undefined) return downloadsNs;
  try{ if(window.claude && typeof window.claude.use==='function'){ downloadsNs = await window.claude.use('downloads'); return downloadsNs; } }catch(e){ downloadsNs = null; return null; }
  return undefined; // fuori da Claude (es. servita dal NAS)
}
async function offerFile(filename, text, mime){
  const dl = await getDownloads();
  if(dl){
    try{ await dl.save({filename, data:text}); toast('File pronto: '+filename); return true; }
    catch(e){ if(e && e.code==='declined'){ toast('Salvataggio annullato'); return false; } }
  } else if(dl===undefined && window.self===window.top){
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return true; }catch(e){}
  }
  dlg().innerHTML = `<div class="dlg"><header><h3>${esc(filename)}</h3><button type="button" class="ghost" data-act="dlg-close">Chiudi</button></header>
    <div class="body"><p class="small">Il salvataggio del file non è disponibile qui. Copia il contenuto e incollalo in un file di testo chiamato <span class="mono">${esc(filename)}</span>.</p><textarea id="fallback-text" style="min-height:240px;font-family:var(--f-mono);font-size:12px" readonly>${esc(text)}</textarea></div>
    <footer><span></span><div class="actions"><button class="primary" data-act="copy-fallback">Copia tutto</button></div></footer></div>`;
  dlg().showModal();
  return false;
}

let pendingImport = null;
function handleImportFile(file){
  const msg = $('#imp-msg'); msg.hidden = true;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.app!==APP_ID || !d.colls) throw new Error('Il file non è un backup di Casa Carobbio.');
      pendingImport = d;
      const n = COLLS.reduce((a,c)=>a+((d.colls[c]||[]).length),0);
      $('#imp-text').textContent = `Backup del ${d.exportedAt ? new Date(d.exportedAt).toLocaleString('it-IT') : 'data sconosciuta'} con ${n} record (${(d.colls.spese||[]).length} spese). Sostituirà tutti i dati di questo browser.`;
      $('#imp-confirm').hidden = false;
    }catch(e){ msg.textContent = e.message || 'File non leggibile.'; msg.hidden = false; }
  };
  r.onerror = () => { msg.textContent = 'File non leggibile.'; msg.hidden = false; };

/* ---------- date ---------- */
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function addMonths(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1+n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last));
  return t.toISOString().slice(0,10);
}
function daysTo(iso){
  if(!ISO.test(iso||'')) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const n = new Date();
  return Math.round((Date.UTC(y,m-1,d) - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()))/86400000);
}
function whenLabel(days){
  if(days===null) return '';
  if(days<0) return `scaduta da ${-days} giorn${days===-1?'o':'i'}`;
  if(days===0) return 'oggi';
  if(days===1) return 'domani';
  return `tra ${days} giorni`;
}
function scadState(z){
  if(z.stato==='completata') return 'done';
  const d = daysTo(z.prossima);
  if(d===null) return 'later';
  if(d<0) return 'late';
  if(d<=30) return 'soon';
  return 'later';
}
function scadenzeAttive(){ return Repo.list('scadenze').filter(z => z.stato!=='completata').sort((a,b) => sortKey(a.prossima).localeCompare(sortKey(b.prossima))); }

async function scadDone(id){
  const z = Repo.get('scadenze', id); if(!z) return;
  const upd = {...z, ultima: todayIso()};
  const n = parseInt(z.ricorrenza, 10);
  if(n && ISO.test(z.prossima||'')){
    let next = addMonths(z.prossima, n), guard = 0;
    while(daysTo(next) < 0 && guard++ < 200) next = addMonths(next, n);
    upd.prossima = next;
    await Repo.put('scadenze', upd); toast('Prossima scadenza: '+fmtDate(next));
  } else {
    upd.stato = 'completata';
    await Repo.put('scadenze', upd); toast('Scadenza completata');
  }
  render();
}

/* ---------- detrazioni ---------- */
function piano(d){
  const spesa = d.spesa||0, pct = +d.percentuale||0, n = Math.max(1, +d.rate||10), y0 = +d.annoInizio || new Date().getFullYear();
  const tot = Math.round(spesa*pct/100);
  return { tot, rata: tot/n, n, y0, y1: y0+n-1 };
}
function viewDetrazioni(){
  const Y = new Date().getFullYear();
  const all = Repo.list('detrazioni').slice().sort((a,b) => (+a.annoInizio||0)-(+b.annoInizio||0));

  const rataY = piani.reduce((a,{p}) => a + (Y>=p.y0 && Y<=p.y1 ? p.rata : 0), 0);
  const benef = [...new Set(all.map(d => d.beneficiario || '—'))].sort();
  let anni = [];
  if(piani.length){ const a0 = Math.min(...piani.map(x=>x.p.y0)), a1 = Math.max(...piani.map(x=>x.p.y1)); for(let y=a0; y<=a1; y++) anni.push(y); }
  const cell = (y, b) => piani.filter(x => (x.d.beneficiario||'—')===b && y>=x.p.y0 && y<=x.p.y1).reduce((a,x)=>a+x.p.rata,0);
  const maxY = anni.length ? Math.max(...anni.map(y => benef.reduce((a,b)=>a+cell(y,b),0))) : 0;
  const senza = Repo.list('spese').filter(s => s.detraibile==='si' && !all.some(d => d.spesaId===s.id));
  return `
  <section><div class="head"><div><h2>Detrazioni fiscali</h2><p class="muted">Ogni piano divide la detrazione in rate annuali. La rata di un anno d'imposta si recupera con la dichiarazione dell'anno dopo.</p></div><button class="primary" data-act="add" data-coll="detrazioni">Aggiungi piano</button></div>
    <div class="note-box">Regole verificate a ottobre 2026 per le spese dal 2027: 36% sull'abitazione principale e 30% sugli altri immobili, in 10 rate, con un tetto di 96.000 € di spesa per unità. La legge di bilancio 2027 può cambiarle: controlla con il commercialista e aggiorna la percentuale nei piani.</div></section>
  <section class="summary">
    <div class="kpi"><span class="l">Detrazioni totali</span><span class="v">${eur0(tot)}</span><span class="s">${all.length} pian${all.length===1?'o':'i'}</span></div>
    <div class="kpi"><span class="l">Rata anno d'imposta ${Y}</span><span class="v">${eur0(rataY)}</span><span class="s">si recupera nel ${Y+1}</span></div>
    <div class="kpi"><span class="l">Ancora da recuperare</span><span class="v">${eur0(restante)}</span><span class="s">dal ${Y} in poi</span></div>
    <div class="kpi"><span class="l">Spese detraibili senza piano</span><span class="v">${senza.length}</span><span class="s">segnate "detraibile" nelle spese</span></div>
  </section>
  ${senza.length ? `<section><h3>Spese detraibili senza piano</h3><div class="list">${senza.map(s => `<div class="row"><div><div class="t">${esc(s.descrizione)}</div><div class="d">${esc(fmtDate(s.data))} · ${eur(s.totale)}${s.bonus?' · '+esc(s.bonus):''}</div></div><div class="side">${ramoPill(s.ramo)}<button class="mini primary" data-act="detr-from-spesa" data-id="${esc(s.id)}">Crea piano</button></div></div>`).join('')}</div></section>` : ''}
  ${piani.length ? `
  <section><h3>Rate per anno d'imposta</h3><div class="table"><table>
    <thead><tr><th>Anno</th>${benef.map(b=>`<th class="n">${esc(b)}</th>`).join('')}<th class="n">Totale</th><th style="width:30%"></th></tr></thead>
    <tbody>${anni.map(y => { const t = benef.reduce((a,b)=>a+cell(y,b),0); return `<tr class="${y===Y?'now':''}"><td class="num">${y}${y===Y?' <small>anno in corso</small>':''}</td>${benef.map(b=>`<td class="n">${eur(Math.round(cell(y,b)))}</td>`).join('')}<td class="n"><b>${eur(Math.round(t))}</b></td><td><div class="bar-track"><div class="bar-fill" style="width:${maxY?Math.max(1,t/maxY*100):0}%"></div></div></td></tr>`; }).join('')}</tbody>
  </table></div></section>
  <section><h3>Piani</h3><div class="list">${piani.map(({d,p}) => { const godute = Math.min(p.n, Math.max(0, Y - p.y0)); const sp = d.spesaId ? Repo.get('spese', d.spesaId) : null; return `<div class="row"><div style="display:grid;gap:4px"><div class="t">${esc(d.titolo)}</div>
      <div class="d">${esc(d.beneficiario||'')} · ${esc(d.tipo||'')} ${esc(d.percentuale)}% di ${eur(d.spesa)} · ${p.n} rate da ${eur(Math.round(p.rata))} · anni d'imposta ${p.y0}–${p.y1}</div>
      ${sp?`<div class="d">Spesa collegata: ${esc(sp.descrizione)} (${esc(fmtDate(sp.data))})</div>`:''}${d.note?`<div class="d">${esc(d.note)}</div>`:''}
      <div class="prog" role="img" aria-label="${godute} rate su ${p.n} con anno d'imposta già chiuso"><i style="width:${godute/p.n*100}%"></i></div><div class="d small">${godute} di ${p.n} anni d'imposta chiusi</div></div>
      <div class="side"><span class="mono num"><b>${eur0(p.tot)}</b></span>${ramoPill(d.ramo)}<button class="mini ghost" data-act="edit" data-coll="detrazioni" data-id="${esc(d.id)}">Modifica</button></div></div>`; }).join('')}</div></section>` :
  `<div class="empty">Nessun piano ancora. Quando registri una spesa detraibile (campo "Detraibile: sì"), la trovi qui pronta per creare il piano.</div>`}`;
}
function detrFromSpesa(id){
  const s = Repo.get('spese', id); if(!s) return;
  const y = parseInt(String(s.data||'').slice(0,4), 10) || new Date().getFullYear();
  const ramo = s.ramo==='pasinetti' ? 'pasinetti' : 'belotti';
  const spesa = s.ramo==='comune' ? Math.round((s.totale||0) * quote(s).b/100) : s.totale;
  openForm('detrazioni', null, { title:'Nuovo piano di detrazione', intro: s.ramo==='comune' ? 'Spesa comune: la spesa ammessa proposta è la quota Belotti. Per la quota Pasinetti crea un secondo piano.' : '',
    preset:{ titolo:s.descrizione, beneficiario:s.pagatoDa||'', ramo, tipo:'Ristrutturazione', annoInizio:y, spesa, percentuale:36, rate:10, spesaId:s.id } });
}

/* ---------- ricerca unica ---------- */
const SEARCH_DEF = {
  spese:      { label:'Spese', nav:'spese', title:r=>r.descrizione, sub:r=>[fmtDate(r.data), r.fornitore, eur(r.totale)] },
  preventivi: { label:'Preventivi', nav:'preventivi', title:r=>r.fornitore, sub:r=>[r.oggetto, eur0(r.importo)] },
  scadenze:   { label:'Scadenze', nav:'scadenze', title:r=>r.titolo, sub:r=>[fmtDate(r.prossima), r.fornitore] },
  detrazioni: { label:'Detrazioni', nav:'detrazioni', title:r=>r.titolo, sub:r=>[r.beneficiario, r.annoInizio] },
  documenti:  { label:'Documenti', nav:'documenti', title:r=>r.titolo, sub:r=>[fmtDate(r.data), r.contenuto] },
  checklist:  { label:'Documenti da procurare', nav:'documenti', title:r=>r.titolo, sub:r=>[r.stato, r.perche] },
  soggetti:   { label:'Persone', nav:'persone', title:r=>r.nome, sub:r=>[r.cellulare, r.telefono, r.email, r.ruolo] },
  criticita:  { label:'Criticità', nav:'criticita', title:r=>r.titolo, sub:r=>[r.stato, r.azione] },
  eventi:     { label:'Storia', nav:'storia', title:r=>r.titolo, sub:r=>[fmtDate(r.data, r.dataTesto), r.riferimento] },
  subalterni: { label:'Subalterni', nav:'subalterni', title:r=>'Sub '+r.sub+' · '+r.descrizione, sub:r=>[r.categoria, r.piano?'piano '+r.piano:''] },
  quote:      { label:'Proprietà', nav:'proprieta', title:r=>r.soggetto+' · '+r.diritto, sub:r=>[r.subs, r.atto] }
};
const MONEY_KEYS = ['totale','importo','importoMax','iva','rendita','spesa'];
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function recText(r){
  return norm(Object.entries(r).filter(([k]) => !k.startsWith('_') && k!=='id' && k!=='url').map(([k,v]) =>
    (typeof v==='number' && MONEY_KEYS.includes(k)) ? moneyInput(v)+' '+(v/100) : (k==='data'||k==='prossima'||k==='dal'||k==='al') ? v+' '+fmtDate(v) : v
  ).join(' '));
}
function hl(text, tokens){
  let out = esc(text);
  tokens.forEach(t => { if(t.length<2) return; const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); out = out.replace(re, '<mark>$1</mark>'); });
  return out;
}
function viewCerca(){
  const q = (UI.q||'').trim();
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  let total = 0;
  const blocks = Object.entries(SEARCH_DEF).map(([coll, def]) => {
    const hits = Repo.list(coll).filter(r => { const t = recText(r); return tokens.every(k => t.includes(k)); });
    total += hits.length;
    if(!hits.length) return '';
    return `<section><h3>${def.label} <span class="muted small">${hits.length}</span></h3><div class="list">${hits.slice(0,30).map(r => {
      const sub = def.sub(r).filter(Boolean).join(' · ');
      const doc = coll==='documenti' ? docHref(r) : '';
      const open = coll==='subalterni' ? `<button class="mini" data-act="pick-sub" data-sub="${esc(r.sub)}">Apri</button>` : `<button class="mini" data-nav="${def.nav}">Vai a ${esc(def.label)}</button>`;
      return `<div class="row"><div><div class="t">${hl(def.title(r)||'', q.split(/\s+/))}</div>${sub?`<div class="d">${hl(sub, q.split(/\s+/))}</div>`:''}</div>
        <div class="side">${ramoPill(r.ramo)}${doc?`<a class="btn mini" href="${esc(doc)}" target="_blank" rel="noopener">Apri file</a>`:''}${open}<button class="mini ghost" data-act="edit" data-coll="${coll}" data-id="${esc(r.id)}">Modifica</button></div></div>`;
    }).join('')}</div></section>`;
  }).join('');
  return `<section><div class="head"><div><div class="eyebrow">Ricerca in tutta la casa</div><h2>${total} risultat${total===1?'o':'i'} per “${esc(q)}”</h2></div><button data-act="clear-search">Chiudi la ricerca</button></div></section>
  ${blocks || '<div class="empty">Nessun risultato. Prova con un nome, un numero di subalterno, un importo (es. 1716) o un anno.</div>'}`;
}

VIEWS.scadenze = viewScadenze;
VIEWS.detrazioni = viewDetrazioni;
VIEWS.cerca = viewCerca;

function clearSearch(){
  const g = $('#global-q'); if(g) g.value = '';
  UI.q = ''; route = UI.prevRoute || 'panoramica'; render();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const id = t.dataset.id;
  if(t.dataset.act==='scad-done') scadDone(id);
  else if(t.dataset.act==='scad-spesa') scadSpesa(id);
  else if(t.dataset.act==='detr-from-spesa') detrFromSpesa(id);
  else if(t.dataset.act==='clear-search') clearSearch();
});
document.addEventListener('input', ev => {
  if(ev.target.id!=='global-q') return;
  const v = ev.target.value;
  UI.q = v;
  if(v.trim()){ if(route!=='cerca') UI.prevRoute = route; route = 'cerca'; }
  else route = UI.prevRoute || 'panoramica';
  render(); window.scrollTo(0,0);
});
document.addEventListener('keydown', ev => { if(ev.target.id==='global-q' && ev.key==='Escape'){ clearSearch(); } });

/* ---------- accesso (solo pagina pubblicata con Supabase) ---------- */
function viewLogin(msg){
  ['#tabs','.nav-pick','#global-q'].forEach(s => { const el = $(s); if(el) el.hidden = true; });
  const u = SupabaseAdapter.user;
  $('#view').innerHTML = `<section class="panel" style="max-width:440px;margin:40px auto"><h2>Accesso</h2>
    ${u ? `<p>Hai fatto l'accesso come <b>${esc(u.email)}</b>.</p>` : `<p class="muted">I dati della casa sono visibili solo ai familiari abilitati. Inserisci la tua email: riceverai un link per entrare.</p>
    <form id="login-form" novalidate><label class="f" for="login-email">Email<input id="login-email" type="email" autocomplete="email" required></label>
    <div class="actions"><button type="submit" class="primary" id="login-btn">Invia il link di accesso</button></div></form>`}
    <p class="small" id="login-msg" aria-live="polite">${esc(msg||'')}</p>
    ${u ? '<div class="actions"><button data-act="logout">Esci</button></div>' : ''}</section>`;
}
async function sendLoginLink(){
  const email = $('#login-email').value.trim(), msg = $('#login-msg'), btn = $('#login-btn');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = 'Inserisci un indirizzo email valido.'; return; }
  btn.disabled = true; msg.textContent = 'Invio in corso…';
  // shouldCreateUser:false: entra solo chi è stato invitato dalla dashboard di Supabase
  const { error } = await SupabaseAdapter.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  btn.disabled = false;
  msg.textContent = !error ? 'Link inviato: apri l\'email da questo dispositivo e tocca il link.'
    : /signups? not allowed/i.test(error.message) ? 'Questo indirizzo non è abilitato. Chiedi di essere invitato.'
    : 'Invio non riuscito: ' + error.message;
}

(async function start(){
  $('#defs').innerHTML = SVG_DEFS;
  if(typeof CC_SUPABASE !== 'undefined'){
    Repo.adapter = SupabaseAdapter;
    try{ await SupabaseAdapter.connect(); }catch(e){ return viewLogin('Connessione a Supabase non riuscita: ' + (e.message||e)); }
    if(!SupabaseAdapter.user) return viewLogin();
    if(!SupabaseAdapter.ruolo) return viewLogin('Questo account non è ancora tra i membri abilitati.');
    try{ await Repo.init(); }catch(e){ return viewLogin('Caricamento dei dati non riuscito: ' + (e.message||e)); }
    history.replaceState(null, '', location.pathname + location.search + (location.hash.includes('access_token') ? '' : location.hash));
  }
  else await Repo.init();
  $('#brand-sub').textContent = (DB.immobile && DB.immobile.intestazione) || '';
  go();
  getDownloads();
})();
</script></body></html>
