<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536">
  <title>Logo in bianco e nero</title>
  <desc>Figura stilizzata simmetrica con antenna, corpo arrotondato, anelli laterali e sfera tratteggiata sottostante.</desc>
  <style>
    /* Animazioni autonome: nessuna libreria o JavaScript richiesti. */
    .antenna-mast { transform-box: fill-box; transform-origin: 50% 100%; }
    .antenna-star { transform-box: view-box; transform-origin: 516px 72px; animation: antenna-sway 3.8s ease-in-out infinite; }
    .character { transform-box: view-box; transform-origin: 512px 620px; animation: hover 3.8s ease-in-out infinite; }
    .energy-lines { transform-box: view-box; transform-origin: 516px 1210px; animation: energy-spin 18s linear infinite; }
    .energy-core { transform-box: fill-box; transform-origin: center; animation: core-pulse 2.2s ease-in-out infinite; }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes antenna-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes energy-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes core-pulse {
      0%, 100% { transform: scale(0.94); }
      50% { transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .antenna-star, .character, .energy-lines, .energy-core { animation: none !important; }
    }
  </style>

  <!-- Antenna -->
  <path class="antenna-mast" fill="#000" d="M451 231 L486 68 Q493 40 510 68 L574 231 L544 236 L501 119 L476 235 Z"/>
  <path class="antenna-star" fill="#000" d="M500 72 L439 47 Q431 44 440 44 L496 56 L485 20 Q483 13 490 19 L515 57 L568 20 Q577 14 573 24 L530 63 L618 48 Q629 46 619 53 L540 77 L608 78 Q620 80 608 84 L535 88 L571 108 Q580 115 568 111 L517 91 L469 112 Q459 116 467 106 L493 84 L448 84 Q436 83 449 78 Z"/>

